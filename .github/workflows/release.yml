name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, such as v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Validate manual tag input
        if: github.event_name == 'workflow_dispatch'
        run: git rev-parse --verify "refs/tags/${{ inputs.tag }}"

      - name: Verify app bundle
        run: make verify

      - name: Package release archive
        run: make release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_RELEASE: ${{ github.event_name == 'push' && github.event.forced }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          test -n "$RELEASE_TAG"
          awk -v version="${RELEASE_TAG#v}" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
          if [ "$REPLACE_RELEASE" = "true" ]; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
            gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 \
              --title "Stay Awake ${RELEASE_TAG}" \
              --notes-file build/release-notes.md \
              --verify-tag
          fi
